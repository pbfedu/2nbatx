<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2nBatx OS - Solicitator</title>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'], display: ['Fredoka', 'sans-serif'] },
          colors: {

            duoBlue: '#1cb0f6', duoBlueDark: '#1899d6',
            duoOrange: '#ff9600', duoOrangeDark: '#e08400',
            duoPurple: '#ce82ff', duoPurpleDark: '#b060e0',
            duoRed: '#ff4b4b', duoRedDark: '#ea2b2b',

          }

  </script>

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
      background-size: 28px 28px;

    }
    input, textarea {
      user-select: text;

      transform: translateY(5px);

</head>
<body class="min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- ÀUDIO ---
    let audioCtx = null;
    const playSound = (type) => {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'pop') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
          gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'error') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(130, now + 0.25);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'success') {
          osc.type = 'triangle';
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.08));
          gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now); osc.stop(now + 0.45);
        }
      } catch (e) {}
    };

    // --- DETECCIÓ DE MATÈRIES NO PERMESES ---
    const checkRestrictedSubject = (text) => {
      if (!text) return null;
      const clean = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      
      const restricted = [
        { keys: ['geografia', 'geo'], reason: 'Geografia està exclosa de Solicitator.' },
        { keys: ['historia del arte', 'historia de l\'art', 'historia de lart', 'art'], reason: 'Història de l\'Art està exclosa de Solicitator.' },
        { keys: ['literatura catalana', 'lit catalana'], reason: 'Literatura Catalana està exclosa de Solicitator.' },
        { keys: ['catala', 'llengua catalana', 'castella', 'castellano', 'lengua castellana', 'angles', 'ingles', 'english', 'historia d\'espanya', 'historia de espana', 'historia', 'filosofia', 'fase general', 'comunes'], reason: 'Les matèries de la Fase General no es poden sol·licitar aquí (ja existeixen o no són de modalitat).' }
      ];

      for (const item of restricted) {
        if (item.keys.some(k => clean === k || clean.includes(k))) {
          return item.reason;
        }
      }
      return null;
    };

    // --- CATÀLEG D'ASSIGNATURES PREGUARDADES AMB ICONA I COLOR ---
    const SUGGESTED_SUBJECTS = [
      { name: 'Física', icon: 'fa-atom', pdfSymbol: 'atom', colorId: 'blue', badgeBg: 'bg-sky-100 text-sky-700 border-sky-200' },
      { name: 'Química', icon: 'fa-flask', pdfSymbol: 'flask', colorId: 'purple', badgeBg: 'bg-purple-100 text-purple-700 border-purple-200' },
      { name: 'Biologia', icon: 'fa-dna', pdfSymbol: 'dna', colorId: 'green', badgeBg: 'bg-emerald-100 text-emerald-700 border-emerald-200' },
      { name: 'Dibuix Tècnic', icon: 'fa-compass-drafting', pdfSymbol: 'compass', colorId: 'orange', badgeBg: 'bg-orange-100 text-orange-700 border-orange-200' },
      { name: 'Economia de l\'Empresa', icon: 'fa-chart-line', pdfSymbol: 'chart', colorId: 'emerald', badgeBg: 'bg-teal-100 text-teal-700 border-teal-200' },
      { name: 'Tecnologia Industrial', icon: 'fa-gears', pdfSymbol: 'gear', colorId: 'blue', badgeBg: 'bg-indigo-100 text-indigo-700 border-indigo-200' },
      { name: 'Llatí', icon: 'fa-landmark', pdfSymbol: 'pillars', colorId: 'orange', badgeBg: 'bg-amber-100 text-amber-800 border-amber-200' },
      { name: 'Grec', icon: 'fa-scroll', pdfSymbol: 'pillars', colorId: 'blue', badgeBg: 'bg-cyan-100 text-cyan-800 border-cyan-200' },
      { name: 'Disseny', icon: 'fa-palette', pdfSymbol: 'palette', colorId: 'pink', badgeBg: 'bg-pink-100 text-pink-700 border-pink-200' }
    ];

    const ALL_QUESTION_TYPES = [
      { label: 'Test ràpid (Tipus Kahoot)', icon: 'fa-bolt', pdfSymbol: 'bolt', color: [255, 150, 0] },
      { label: 'Veritat o Mentida', icon: 'fa-circle-check', pdfSymbol: 'check', color: [88, 204, 2] },
      { label: 'Conectar conceptes / Parelles', icon: 'fa-link', pdfSymbol: 'link', color: [28, 176, 246] },
      { label: 'Completar el mot perdut', icon: 'fa-pen-clip', pdfSymbol: 'pen', color: [16, 185, 129] },
      { label: 'Càlcul / Fórmules pas a pas', icon: 'fa-square-root-variable', pdfSymbol: 'math', color: [168, 85, 247] },
      { label: 'Ordenar processos / Línia temporal', icon: 'fa-arrow-down-1-9', pdfSymbol: 'timeline', color: [236, 72, 153] },
      { label: 'Identificar imatges / Esquemes', icon: 'fa-image', pdfSymbol: 'image', color: [245, 158, 11] },
      { label: 'Simulacre preguntes curtes PAU', icon: 'fa-file-pen', pdfSymbol: 'doc', color: [71, 85, 105] }
    ];

    // --- DIBUIXANT D'ICONES VECTORIALS PER AL PDF (jsPDF) ---
    const drawVectorIcon = (doc, symbol, cx, cy, size, rgb) => {
      doc.saveGraphicsState();
      doc.setDrawColor(...rgb);
      doc.setFillColor(...rgb);
      doc.setLineWidth(size * 0.13);
      const r = size / 2;

      switch (symbol) {
        case 'atom': // Física
          doc.circle(cx, cy, r * 0.22, 'F');
          doc.ellipse(cx, cy, r * 0.9, r * 0.35, 'S');
          doc.ellipse(cx, cy, r * 0.35, r * 0.9, 'S');
          break;
        case 'flask': // Química
          doc.line(cx - r * 0.25, cy - r * 0.85, cx + r * 0.25, cy - r * 0.85);
          doc.line(cx - r * 0.18, cy - r * 0.85, cx - r * 0.18, cy - r * 0.35);
          doc.line(cx + r * 0.18, cy - r * 0.85, cx + r * 0.18, cy - r * 0.35);
          doc.triangle(cx, cy - r * 0.45, cx - r * 0.8, cy + r * 0.85, cx + r * 0.8, cy + r * 0.85, 'S');
          doc.line(cx - r * 0.45, cy + r * 0.3, cx + r * 0.45, cy + r * 0.3);
          break;
        case 'dna': // Biologia
          doc.line(cx - r * 0.5, cy - r * 0.8, cx + r * 0.5, cy + r * 0.8);
          doc.line(cx + r * 0.5, cy - r * 0.8, cx - r * 0.5, cy + r * 0.8);
          doc.line(cx - r * 0.35, cy - r * 0.55, cx + r * 0.35, cy - r * 0.55);
          doc.line(cx - r * 0.35, cy + r * 0.55, cx + r * 0.35, cy + r * 0.55);
          break;
        case 'compass': // Dibuix Tècnic
          doc.circle(cx, cy - r * 0.65, r * 0.18, 'F');
          doc.line(cx, cy - r * 0.5, cx - r * 0.65, cy + r * 0.85);
          doc.line(cx, cy - r * 0.5, cx + r * 0.65, cy + r * 0.85);
          doc.line(cx - r * 0.45, cy + r * 0.2, cx + r * 0.45, cy + r * 0.2);
          break;
        case 'chart': // Economia
          doc.rect(cx - r * 0.75, cy + r * 0.1, r * 0.35, r * 0.75, 'F');
          doc.rect(cx - r * 0.18, cy - r * 0.35, r * 0.35, r * 1.2, 'F');
          doc.rect(cx + r * 0.4, cy - r * 0.8, r * 0.35, r * 1.65, 'F');
          break;
        case 'gear': // Tecnologia
          doc.circle(cx, cy, r * 0.6, 'S');
          doc.circle(cx, cy, r * 0.22, 'F');
          for (let a = 0; a < 360; a += 45) {
            const rad = (a * Math.PI) / 180;
            doc.line(cx + Math.cos(rad) * r * 0.6, cy + Math.sin(rad) * r * 0.6, cx + Math.cos(rad) * r * 0.9, cy + Math.sin(rad) * r * 0.9);
          }
          break;
        case 'pillars': // Llatí / Grec
          doc.triangle(cx, cy - r * 0.9, cx - r * 0.9, cy - r * 0.45, cx + r * 0.9, cy - r * 0.45, 'F');
          doc.line(cx - r * 0.55, cy - r * 0.4, cx - r * 0.55, cy + r * 0.7);
          doc.line(cx, cy - r * 0.4, cx, cy + r * 0.7);
          doc.line(cx + r * 0.55, cy - r * 0.4, cx + r * 0.55, cy + r * 0.7);
          doc.line(cx - r * 0.85, cy + r * 0.8, cx + r * 0.85, cy + r * 0.8);
          break;
        case 'palette': // Disseny
          doc.circle(cx, cy, r * 0.82, 'S');
          doc.circle(cx - r * 0.3, cy - r * 0.25, r * 0.15, 'F');
          doc.circle(cx + r * 0.25, cy - r * 0.3, r * 0.15, 'F');
          doc.circle(cx - r * 0.25, cy + r * 0.3, r * 0.15, 'F');
          break;
        case 'bolt': // Kahoot
          doc.triangle(cx + r * 0.15, cy - r * 0.9, cx - r * 0.55, cy + r * 0.1, cx + r * 0.1, cy + r * 0.1, 'F');
          doc.triangle(cx - r * 0.15, cy + r * 0.9, cx + r * 0.55, cy - r * 0.1, cx - r * 0.1, cy - r * 0.1, 'F');
          break;
        case 'check': // Veritat o Mentida
          doc.line(cx - r * 0.65, cy + r * 0.05, cx - r * 0.15, cy + r * 0.6);
          doc.line(cx - r * 0.15, cy + r * 0.6, cx + r * 0.75, cy - r * 0.55);
          break;
        case 'link': // Conectar
          doc.circle(cx - r * 0.35, cy, r * 0.42, 'S');
          doc.circle(cx + r * 0.35, cy, r * 0.42, 'S');
          break;
        case 'pen': // Mot Perdut
          doc.line(cx - r * 0.6, cy + r * 0.6, cx + r * 0.6, cy - r * 0.6);
          doc.line(cx - r * 0.7, cy + r * 0.7, cx + r * 0.7, cy + r * 0.7);
          break;
        case 'math': // Càlcul
          doc.line(cx - r * 0.75, cy + r * 0.1, cx - r * 0.4, cy + r * 0.7);
          doc.line(cx - r * 0.4, cy + r * 0.7, cx - r * 0.05, cy - r * 0.65);
          doc.line(cx - r * 0.05, cy - r * 0.65, cx + r * 0.8, cy - r * 0.65);
          break;
        case 'timeline': // Línia temporal
          doc.line(cx, cy - r * 0.8, cx, cy + r * 0.8);
          doc.circle(cx, cy - r * 0.55, r * 0.22, 'F');
          doc.circle(cx, cy, r * 0.22, 'F');
          doc.circle(cx, cy + r * 0.55, r * 0.22, 'F');
          break;
        case 'image': // Esquemes
          doc.rect(cx - r * 0.8, cy - r * 0.65, r * 1.6, r * 1.3, 'S');
          doc.circle(cx - r * 0.3, cy - r * 0.2, r * 0.16, 'F');
          doc.triangle(cx - r * 0.5, cy + r * 0.5, cx + r * 0.1, cy - r * 0.05, cx + r * 0.65, cy + r * 0.5, 'F');
          break;
        case 'doc': // Simulacre PAU
        default: // Estrella / Generic
          doc.circle(cx, cy, r * 0.75, 'S');
          doc.circle(cx, cy, r * 0.28, 'F');
          break;
      }
      doc.restoreGraphicsState();
    };

    // --- GENERADOR DEL TICKET PDF PREMIUM ---
    const generateTicketPDF = (data, ticketId) => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

      const pageW = 210;
      const pageH = 297;
      const margin = 15;
      const contentW = pageW - margin * 2;

      const colorMap = {
        blue: { main: [28, 176, 246], dark: [24, 153, 214], light: [224, 242, 254] },
        green: { main: [88, 204, 2], dark: [70, 163, 2], light: [220, 252, 231] },
        purple: { main: [168, 85, 247], dark: [126, 34, 206], light: [243, 232, 255] },
        orange: { main: [255, 150, 0], dark: [224, 132, 0], light: [255, 237, 213] },
        emerald: { main: [16, 185, 129], dark: [5, 150, 105], light: [209, 250, 229] },
        pink: { main: [236, 72, 153], dark: [190, 24, 93], light: [252, 231, 243] }
      };
      const palette = colorMap[data.themeColor] || colorMap.blue;

      // Dibuixa el fons base i el marc de tiquet
      const drawPageFrame = () => {
        doc.setFillColor(241, 245, 249);
        doc.rect(0, 0, pageW, pageH, 'F');

        // Ombra 3D del tiquet principal
        doc.setFillColor(203, 213, 225);
        doc.roundedRect(margin, 12, contentW, pageH - 22, 8, 8, 'F');

        // Cos blanc del tiquet
        doc.setFillColor(255, 255, 255);
        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.6);
        doc.roundedRect(margin, 10, contentW, pageH - 22, 8, 8, 'FD');
      };

      drawPageFrame();
      let y = 10;

      // 1. CAPÇALERA HERO AMB OMBRES 3D I ICONA DE L'ASSIGNATURA
      doc.setFillColor(...palette.dark);
      doc.roundedRect(margin, y, contentW, 48, 8, 8, 'F');
      doc.setFillColor(...palette.main);
      doc.roundedRect(margin, y, contentW, 45.5, 8, 8, 'F');
      // Tapem els cantons inferiors arrodonits de la capçalera perquè encaixi recte amb el tiquet
      doc.rect(margin, y + 36, contentW, 12, 'F');

      // Medalló blanc circular amb la icona de l'assignatura
      const badgeX = margin + 22;
      const badgeY = y + 24;
      doc.setFillColor(...palette.dark);
      doc.circle(badgeX, badgeY + 1.5, 13.5, 'F');
      doc.setFillColor(255, 255, 255);
      doc.circle(badgeX, badgeY, 13.5, 'F');

      const matchedSub = SUGGESTED_SUBJECTS.find(s => s.name.toLowerCase() === data.subject.toLowerCase());
      const subSymbol = matchedSub ? matchedSub.pdfSymbol : 'default';
      drawVectorIcon(doc, subSymbol, badgeX, badgeY, 14, palette.main);

      // Títols capçalera
      const textStartX = margin + 42;
      doc.setFillColor(255, 255, 255);
      doc.roundedRect(textStartX, y + 8, 58, 6.5, 3, 3, 'F');
      doc.setTextColor(...palette.dark);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.text(`2NBATX OS  •  TICKET #${ticketId}`, textStartX + 3, y + 12.5);

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(22);
      const titleFitted = doc.splitTextToSize(data.subject.toUpperCase(), contentW - 50)[0];
      doc.text(titleFitted, textStartX, y + 25);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      const dateStr = new Date().toLocaleDateString('ca-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      doc.text(`Proposat per: ${data.studentName || 'Estudiant Anònim'}   •   ${dateStr}`, textStartX, y + 34);

      y += 48;

      // 2. TALL DE PERFORACIÓ ESTIL ENTRADA / PASSI VIP
      doc.setDrawColor(203, 213, 225);
      doc.setLineWidth(0.7);
      doc.setLineDashPattern([2.5, 2.5], 0);
      doc.line(margin + 6, y, pageW - margin - 6, y);
      doc.setLineDashPattern([], 0);

      // Mosques semicirculars als laterals
      doc.setFillColor(241, 245, 249);
      doc.circle(margin, y, 4.5, 'F');
      doc.circle(pageW - margin, y, 4.5, 'F');

      y += 7;

      // 3. AVÍS DESTACAT SENSE COMPROMÍS
      const innerMargin = margin + 8;
      const innerW = contentW - 16;

      doc.setFillColor(254, 243, 199);
      doc.setDrawColor(251, 191, 36);
      doc.setLineWidth(0.6);
      doc.roundedRect(innerMargin, y, innerW, 22, 4, 4, 'FD');

      doc.setFillColor(245, 158, 11);
      doc.circle(innerMargin + 7, y + 11, 4, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('!', innerMargin + 6.1, y + 12.5);

      doc.setTextColor(146, 64, 14);
      doc.setFontSize(9.5);
      doc.text('PROPOSTA SUBJECTA A REVISIÓ (SENSE COMPROMÍS)', innerMargin + 15, y + 8);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
      const warnLines = doc.splitTextToSize(
        'Envia aquest PDF a l\'administrador juntament amb els APUNTS DEL TEMA. S\'estudiarà i es PLANTEJARÀ la seva creació sense cap garantia.',
        innerW - 18
      );
      doc.text(warnLines, innerMargin + 15, y + 13.5);

      y += 28;

      // 4. TARGETES DE MECÀNIQUES AMB ICONES VECTORIALS EN GRAELLA
      doc.setTextColor(30, 41, 59);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text('Tipus d\'activitats i minijocs seleccionats:', innerMargin, y + 4);
      y += 8;

      const selectedQObjs = ALL_QUESTION_TYPES.filter(q => data.questionTypes.includes(q.label));
      if (selectedQObjs.length === 0) {
        selectedQObjs.push({ label: 'Format lliure a criteri de l\'administrador', pdfSymbol: 'doc', color: [100, 116, 139] });
      }

      const colW = (innerW - 4) / 2;
      const pillH = 11.5;

      selectedQObjs.forEach((qItem, idx) => {
        const col = idx % 2;
        const px = innerMargin + col * (colW + 4);

        if (col === 0 && y + pillH > pageH - 25) {
          doc.addPage();
          drawPageFrame();
          y = 20;
        }

        // Ombra i fons de la píndola
        doc.setFillColor(226, 232, 240);
        doc.roundedRect(px, y + 0.8, colW, pillH, 3.5, 3.5, 'F');
        doc.setFillColor(248, 250, 252);
        doc.setDrawColor(226, 232, 240);
        doc.roundedRect(px, y, colW, pillH, 3.5, 3.5, 'FD');

        // Cercle de color amb la icona dibuixada
        doc.setFillColor(...qItem.color);
        doc.circle(px + 6.5, y + pillH / 2, 3.8, 'F');
        drawVectorIcon(doc, qItem.pdfSymbol, px + 6.5, y + pillH / 2, 4.4, [255, 255, 255]);

        // Text de l'activitat
        doc.setTextColor(51, 65, 85);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8.5);
        const shortLabel = doc.splitTextToSize(qItem.label, colW - 15)[0];
        doc.text(shortLabel, px + 12.5, y + pillH / 2 + 1.2);

        if (col === 1 || idx === selectedQObjs.length - 1) {
          y += pillH + 3;
        }
      });

      y += 4;

      // 5. BLOCS DE RESPOSTA DETALLATS
      const addDetailCard = (numberBadge, title, bodyText) => {
        const cleanBody = bodyText && bodyText.trim() ? bodyText.trim() : 'No especificat per l\'usuari.';
        const lines = doc.splitTextToSize(cleanBody, innerW - 14);
        const cardH = 13 + lines.length * 4.8;

        if (y + cardH > pageH - 24) {
          doc.addPage();
          drawPageFrame();
          y = 20;
        }

        // Ombra 3D subtil
        doc.setFillColor(226, 232, 240);
        doc.roundedRect(innerMargin, y + 1, innerW, cardH, 4, 4, 'F');

        // Targeta
        doc.setFillColor(255, 255, 255);
        doc.setDrawColor(226, 232, 240);
        doc.roundedRect(innerMargin, y, innerW, cardH, 4, 4, 'FD');

        // Píndola numèrica del color de l'assignatura
        doc.setFillColor(...palette.light);
        doc.roundedRect(innerMargin + 4, y + 3.5, 7, 6, 2, 2, 'F');
        doc.setTextColor(...palette.dark);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8.5);
        doc.text(String(numberBadge), innerMargin + 6.5, y + 7.7);

        // Títol del bloc
        doc.setTextColor(30, 41, 59);
        doc.setFontSize(10);

      bars.forEach((w, i) => {

      doc.text(`SOLICITATOR • 2NBATX OS   |   Adjunta els apunts en enviar aquest PDF`, pageW - innerMargin, footerY + 4, { align: 'right' });

                          1. Descarrega el teu <strong>Ticket en PDF</strong> amb el botó de sota.<br/>
                          2. Envia aquest PDF a l'administrador <strong>juntament amb els apunts d'aquest tema</strong>.<br/>
                          3. Amb el material rebut, <strong>es PLANTEJARÀ que es faci</strong> (sense compromís ni garantia de creació).
                        </p>
                      </div>

                      <div className="pt-2 flex flex-col sm:flex-row gap-3">
                        <button
                          onClick={() => { playSound('success'); generateTicketPDF(form, ticketId); }}
                          className="flex-1 bg-duoGreen hover:bg-duoGreenDark text-white font-display font-black text-lg py-4 px-6 rounded-[22px] border-x-2 border-t-2 border-b-[6px] border-black/15 shadow-lg duo-btn flex items-center justify-center gap-3"
                        >
                          <i className="fa-solid fa-file-pdf text-2xl"></i>
                          <span>Descarregar Ticket PDF</span>
                        </button>

                        <button
                          onClick={() => { playSound('pop'); setStep(1); }}
                          className="bg-slate-100 hover:bg-slate-200 text-slate-600 font-display font-black text-base py-4 px-6 rounded-[22px] border-2 border-b-[6px] border-slate-300 duo-btn"
                        >
                          Editar
                        </button>
                      </div>
                    </div>
                  </div>
                </motion.div>
              )}

            </AnimatePresence>
          </main>

          {/* BOTONS DE NAVEGACIÓ INFERIOR */}
          {step >= 1 && step <= totalSteps && (
            <footer className="py-4 flex items-center justify-between gap-4">
              <button
                onClick={prevStep}
                className="bg-white hover:bg-slate-100 text-slate-500 font-display font-black text-base py-3.5 px-6 rounded-[20px] border-2 border-b-[5px] border-slate-200 duo-btn"
              >
                Enrere
              </button>

              <button
                disabled={step === 1 && (!form.subject.trim() || !!restrictionError)}
                onClick={nextStep}
                className={`flex-1 max-w-xs font-display font-black text-lg py-3.5 px-8 rounded-[20px] border-x-2 border-t-2 border-b-[5px] duo-btn transition-all ${
                  step === 1 && (!form.subject.trim() || !!restrictionError)
                    ? 'bg-slate-200 text-slate-400 border-slate-300 cursor-not-allowed'
                    : step === totalSteps
                      ? 'bg-duoGreen text-white border-black/15 shadow-md'
                      : 'bg-duoBlue text-white border-black/15 shadow-md'
                }`}
              >
                {step === totalSteps ? 'Generar Ticket' : 'Següent'}
              </button>
            </footer>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
